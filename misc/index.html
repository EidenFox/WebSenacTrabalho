<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivos Misc - EidenFox</title>
    <link rel="stylesheet" href="../style.css"> <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        a {
            text-decoration: none;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            background: rgba(182, 182, 182, 0.22);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 0, 123, 0.5);
            transition: 0.3s;
            text-decoration: none;
        }
        .file-item:hover {
            background-color: rgba(51, 0, 46, 0.5);
            box-shadow: 0 0px 20px rgba(255, 0, 225, 0.4);
            transform: translateX(10px);
        }
        .file-name {
            color: aliceblue;
            font-family: 'Merienda', cursive;
            text-shadow: #ff008c 2px 2px;
        }
    </style>
</head>
<body class="body-background">
    <header>
        <div class="header-div">
            <h1>Arquivos Adicionais</h1>
        </div>
    </header>

    <h2>Arquivos</h2>

    <section class="content">
        <div id="file-container" class="file-list">
            <p id="loading">Carregando arquivos...</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 EidenFox. Todos os direitos reservados.</p><br>
        <p>Desenvolvido por Daniel Rocha da Cruz</p>
    </footer>

    <script>
        async function listFiles() {
            const user = 'EidenFox';
            const repo = 'WebSenacTrabalho';
            const path = 'misc';
            const container = document.getElementById('file-container');


            const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`);
            const data = await response.json();
            
            container.innerHTML = '';

            data.forEach(file => {
                if (file.name !== 'index.html') {
                    const doc = document.createElement('doc');
                    doc.href = file.name;
                    doc.className = 'file-item';
                    doc.innerHTML = `<a href="${doc.href}" class="file-name">📄 ${file.name}</a>`;
                    container.appendChild(doc);
                }
            });
        }

        listFiles();

    </script>

    </body>
</html>
