<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeChat IA</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
</head>
<body class="body-background">
    <div class="chat-wrapper">
        <header class="chat-header">
            <h1>Agente de IA</h1>
            <br><p>"Fala sobre Animes e Batata frita"</p>
        </header>

        <main class="chat-container">
            <div class="messages-box" id="messages-box">
                <div class="message ai-message">
                    <div class="message-content">
                        <p>Olá, sou o Agente de IA ... pode me perguntar sobre ...</p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="chat-input-area">
            <div class="input-container">
                <textarea id="message-input" placeholder="Envie uma mensagem para a IA..." rows="1"></textarea>
                <button id="send-button" title="Enviar Mensagem">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <p class="disclaimer">Inteligência Artificial - pode cometer erros</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
